<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e0e5ec" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CHRONOS // 设置</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/settings.css" />

  <!-- 偏好需尽早应用（避免主题/语言闪烁） -->
  <script src="js/config.js"></script>
  <script src="js/prefs.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/device.js"></script>
</head>

<body data-page="settings">
  <div class="scanlines" aria-hidden="true"></div>

  <!-- ============ 顶栏 ============ -->
  <header class="topbar">
    <div class="brand">
      <a class="brand-mark" href="index.html">CHRONOS<span class="dot pulse"></span></a>
      <span class="brand-sub" data-i18n="settings.title">SETTINGS // 系统设置</span>
    </div>
    <div class="topbar-right">
      <span class="chip plain" id="device-badge">DEVICE: --</span>
      <a class="btn ghost" id="back-btn" href="index.html" data-i18n="common.back">返回面板</a>
      <button class="btn ghost" id="logout-btn" type="button" data-i18n="common.logout">退出登录</button>
    </div>
  </header>

  <main class="settings-wrap">
    <!-- 外观 -->
    <section class="panel">
      <div class="panel-head">
        <span data-i18n="settings.appearance">APPEARANCE</span>
        <span class="head-right"><span class="chip plain">UI</span></span>
      </div>
      <div class="panel-body">
        <div class="set-row">
          <div class="set-info">
            <div class="set-title" data-i18n="settings.theme">主题</div>
            <div class="set-desc" data-i18n="settings.theme.desc">切换浅色 / 深色模式</div>
          </div>
          <div class="seg" id="theme-seg" role="group">
            <button class="seg-btn" type="button" data-value="light" data-i18n="settings.theme.light">浅色</button>
            <button class="seg-btn" type="button" data-value="dark" data-i18n="settings.theme.dark">深色</button>
          </div>
        </div>
        <div class="set-row">
          <div class="set-info">
            <div class="set-title" data-i18n="settings.scanlines">扫描线质感</div>
            <div class="set-desc" data-i18n="settings.scanlines.desc">关闭可提升低性能设备流畅度</div>
          </div>
          <button class="switch" id="scanlines-switch" type="button" role="switch" aria-checked="true">
            <span class="knob"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- 语言 -->
    <section class="panel">
      <div class="panel-head">
        <span data-i18n="settings.head.language">LANGUAGE // 语言</span>
        <span class="head-right"><span class="chip plain">i18N</span></span>
      </div>
      <div class="panel-body">
        <div class="set-row">
          <div class="set-info">
            <div class="set-title" data-i18n="settings.language">语言 / LANGUAGE</div>
            <div class="set-desc" data-i18n="settings.language.desc">界面显示语言</div>
          </div>
          <div class="seg" id="lang-seg" role="group">
            <button class="seg-btn" type="button" data-value="zh">中文</button>
            <button class="seg-btn" type="button" data-value="en">EN</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 监控 -->
    <section class="panel">
      <div class="panel-head">
        <span data-i18n="settings.monitoring">MONITORING // 监控</span>
        <span class="head-right"><span class="chip plain">POLL</span></span>
      </div>
      <div class="panel-body">
        <div class="field">
          <label for="poll-select" data-i18n="settings.poll">轮询间隔</label>
          <select id="poll-select">
            <option value="3000" data-i18n="settings.poll.3">3 秒</option>
            <option value="5000" data-i18n="settings.poll.5">5 秒（推荐）</option>
            <option value="10000" data-i18n="settings.poll.10">10 秒</option>
            <option value="30000" data-i18n="settings.poll.30">30 秒</option>
            <option value="60000" data-i18n="settings.poll.60">60 秒</option>
          </select>
        </div>
        <div class="set-desc" data-i18n="settings.poll.desc">间隔越大，服务器开销越低</div>
      </div>
    </section>

    <!-- 数据 -->
    <section class="panel">
      <div class="panel-head">
        <span data-i18n="settings.data">DATA // 数据</span>
        <span class="head-right"><span class="chip plain">LOCAL</span></span>
      </div>
      <div class="panel-body">
        <div class="set-desc mb10" data-i18n="settings.data.desc">偏好设置保存在本机浏览器，不上传服务器</div>
        <button class="btn ghost" id="reset-btn" type="button" style="width:100%" data-i18n="common.reset">恢复默认</button>
        <div class="hint mt8" id="data-hint"></div>
      </div>
    </section>

    <!-- 会话 -->
    <section class="panel">
      <div class="panel-head">
        <span data-i18n="settings.session">SESSION // 会话</span>
        <span class="head-right"><span class="chip plain">AUTH</span></span>
      </div>
      <div class="panel-body">
        <div class="set-desc mb10" data-i18n="settings.session.desc">退出后需要重新登录鉴权</div>
        <button class="btn danger" id="logout-btn-2" type="button" style="width:100%" data-i18n="common.logout">退出登录</button>
      </div>
    </section>

    <!-- 安全设置 -->
    <section class="panel set-wide">
      <div class="panel-head">
        <span data-i18n="settings.security">SECURITY // 安全设置</span>
        <span class="head-right"><span class="chip plain" data-i18n="settings.badge.auth">鉴权</span></span>
      </div>
      <div class="panel-body">
        <div class="set-desc mb10" data-i18n="settings.sec.desc">修改登录账号与密码，至少保留一项</div>
        <form id="sec-form" autocomplete="off" class="sec-grid">
          <div class="field">
            <label for="sec-current" data-i18n="settings.sec.current">当前密码 CURRENT</label>
            <input id="sec-current" type="password" autocomplete="current-password" />
          </div>
          <div class="field">
            <label for="sec-new-user" data-i18n="settings.sec.newUser">新账号 NEW USER（可留空）</label>
            <input id="sec-new-user" type="text" autocomplete="off" spellcheck="false" />
          </div>
          <div class="field">
            <label for="sec-new-pass" data-i18n="settings.sec.newPass">新密码 NEW PASS（可留空）</label>
            <input id="sec-new-pass" type="password" autocomplete="new-password" />
          </div>
          <div class="hint" id="sec-hint"></div>
          <button class="btn primary" id="sec-btn" type="submit" style="width:100%" data-i18n="common.save">保存</button>
        </form>
      </div>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
