<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#10131c" />
    <meta name="description" content="CHRONOS 个人工作台 · 课表、服务与项目动态" />
    <title>我的工作台</title>
    <link rel="icon" type="image/svg+xml" href="/workbench.svg" />
    <script>
      try {
        const mode = localStorage.getItem("workbench-mode") || "auto";
        document.documentElement.dataset.theme =
          mode === "auto"
            ? matchMedia("(prefers-color-scheme:dark)").matches
              ? "dark"
              : "light"
            : mode;
        localStorage.setItem("workbench-mode",document.documentElement.dataset.theme);
        document.documentElement.dataset.palette =
          localStorage.getItem("workbench-palette") || "lavender";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
