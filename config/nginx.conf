# ============================================================
# CHRONOS — Nginx 站点配置（Ubuntu / Debian）
# 放置位置：/etc/nginx/conf.d/chronos-monitoring.conf
# 说明：前端由 Nginx 静态托管；/api/ 反向代理给本机 Flask 后端
# ============================================================

server {
    listen 80;
    listen [::]:80;

    # ↓↓↓ 改成你的域名或公网 IP ↓↓↓
    server_name panel.example.com;

    # 前端目录：即 frontend/ 内的文件（index.html / login.html / css / js）
    root /var/www/chronos-monitoring;
    index index.html;

    client_max_body_size 2m;
    charset utf-8;

    # gzip 提速（2核2G 轻量服务器友好：level 5 平衡 CPU 与压缩率）
    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ---- 前端静态页面 ----
    location / {
        try_files $uri $uri/ =404;
    }

    # 快捷入口：/login → /login.html
    location = /login {
        return 302 /login.html;
    }

    # 页面不缓存，确保改密/更新后立即生效
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /login.html {
        add_header Cache-Control "no-store";
    }
    location = /settings.html {
        add_header Cache-Control "no-store";
    }

    # 字体文件：内容永不变化，长缓存 + immutable
    location ~* \.woff2$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 其余静态资源短缓存
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # ---- 后端 API 反向代理 ----
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}

# ============================================================
# HTTPS（可选，推荐）
# ------------------------------------------------------------
# 方式一：使用 certbot 申请免费证书
#   sudo apt install certbot python3-certbot-nginx -y
#   sudo certbot --nginx -d panel.example.com
#   证书签发后，certbot 会自动改写上面的 server 块并加上 443 监听。
#
# 方式二：反向代理到雷池 WAF / 宝塔面板，由它们统一管理证书。
#
# 注意：启用 HTTPS 后，请把 backend/app.py 中的
#   SESSION_COOKIE_SECURE = False  改为 True，
# 让登录 Cookie 仅通过 HTTPS 传输。
# ============================================================